; Supervisord — un seul conteneur Docker pour le stack Chillers :
;   1. backend    → API Express (port 4000, port public Render)
;   2. torrserver → streaming torrent P2P (port 8090, interne)
;   3. prowlarr   → gestionnaire d'indexeurs (port 9696, interne)
;
; Les variables d'env Render (MONGO_URI, PROWLARR_API_KEY, ...) sont
; transmises automatiquement aux processus enfants.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:backend]
command=node dist/server.js
directory=/app/backend
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:torrserver]
command=/opt/torrserver/TorrServer -p 8090 -d /data/torrserver
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:prowlarr]
command=/opt/prowlarr/Prowlarr/Prowlarr -nobrowser -data=/data/prowlarr
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
